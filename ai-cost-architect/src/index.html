<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Free AI Token Counter for GPT, Claude &amp; Gemini — TokIQ</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paste any text and instantly count tokens for GPT-4o, Claude, Gemini and more. Character, word and line counts too — all in your browser.">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="theme-color" content="#000000">
  <meta property="og:site_name" content="TokIQ">
  <meta property="og:title" content="Free AI Token Counter for GPT, Claude &amp; Gemini — TokIQ">
  <meta property="og:description" content="Paste any text and instantly count tokens for GPT-4o, Claude, Gemini and more. Character, word and line counts too — all in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tokiq.in/tools/token-calculator">
  <meta property="og:image" content="https://tokiq.in/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TokIQ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Free AI Token Counter for GPT, Claude &amp; Gemini — TokIQ">
  <meta name="twitter:description" content="Paste any text and instantly count tokens for GPT-4o, Claude, Gemini and more. Character, word and line counts too — all in your browser.">
  <meta name="twitter:image" content="https://tokiq.in/og-image.png">
  <meta name="author" content="TokIQ">
  <!--
    These four tags are per-page and are rewritten for every route by
    scripts/prerender-html.mjs at build time, from src/app/core/seo/page-seo.json:
    <title>, description, og:*/twitter:*, and the canonical below. The values
    checked in here are the ones for `/`, which renders the token calculator —
    so `/` declares /tools/token-calculator canonical rather than competing
    with it. Do not hand-edit; edit page-seo.json.
  -->
  <link rel="canonical" href="https://tokiq.in/tools/token-calculator">
  <!-- Icons. The .ico carries 16/32/48 for the browser tab; the 96/192 PNGs are
       what Google Search picks up for the result-list icon (it wants >=48px, square). -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    The app is dark-only. Painting the ground black here (rather than waiting
    for styles.css) avoids a white flash on first paint and on hard reloads.
  -->
  <style>
    html { color-scheme: dark; background-color: #000; }
    body { margin: 0; background-color: #000; }
  </style>
  <!-- Organization + WebSite schema. `logo` is what Google associates with the
       site in rich results; it must be a square PNG on an absolute URL. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://tokiq.in/#organization",
        "name": "TokIQ",
        "url": "https://tokiq.in/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://tokiq.in/icon-512.png",
          "width": 512,
          "height": 512
        },
        "image": "https://tokiq.in/og-image.png"
      },
      {
        "@type": "WebSite",
        "@id": "https://tokiq.in/#website",
        "name": "TokIQ",
        "url": "https://tokiq.in/",
        "publisher": { "@id": "https://tokiq.in/#organization" }
      }
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
